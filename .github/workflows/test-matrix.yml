name: Compatibility test matrix

# Reusable: runs the pytest suite across the non-quality-gate Python versions
# (3.12 is covered by quality-gate.yml, which already runs pytest with
# coverage). Shared by ci.yml (push/PR gate) and release.yml (tag trigger
# chain), so a tag can't reach PyPI on the strength of the 3.12-only
# quality-gate run alone.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.13"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      - name: Run compatibility tests
        run: uv run --extra dev pytest tests/
