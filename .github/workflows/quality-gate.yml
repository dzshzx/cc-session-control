name: Quality gate

on:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      - name: Run Ruff lint
        run: uv run --extra dev ruff check src tests scripts

      - name: Check Ruff formatting
        run: uv run --extra dev ruff format --check src tests scripts

      - name: Run mypy
        run: uv run --extra dev mypy src/

      - name: Check source file sizes
        run: uv run --extra dev python scripts/check_file_sizes.py --tests tests

      - name: Check for hardcoded home paths
        run: |
          if grep -rn --include='*.py' '/home/' src/; then
            exit 1
          fi

      - name: Run tests with branch coverage
        run: >
          uv run --extra dev pytest tests/
          --cov=cc_session_control
          --cov-branch
          --cov-report=term-missing
          --cov-report=json

      - name: Enforce coverage floors
        run: >
          uv run --extra dev python scripts/check_coverage.py coverage.json
          --statement-floor 91
          --branch-floor 82
