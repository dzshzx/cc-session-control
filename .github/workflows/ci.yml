name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gate:
    permissions:
      contents: read
    uses: ./.github/workflows/quality-gate.yml

  # 3.12 is already run (with coverage) by quality-gate above; this matrix
  # only covers 3.13/3.14 so the same interpreter isn't tested twice per run.
  test:
    permissions:
      contents: read
    uses: ./.github/workflows/test-matrix.yml

  build:
    name: Build and smoke test
    needs:
      - quality-gate
      - test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      - name: Build distributions
        run: uv build --no-sources

      - name: Smoke test wheel command
        run: uv run --isolated --no-project --with dist/*.whl csctl --version

      - name: Smoke test source distribution command
        run: uv run --isolated --no-project --with dist/*.tar.gz csctl --version
