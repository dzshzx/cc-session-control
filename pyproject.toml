[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cc-session-control"
dynamic = ["version"]
description = "TUI manager for Claude Code sessions and Remote Control"
requires-python = ">=3.12"
license = "MIT"
readme = "README.md"
authors = [{ name = "dzshzx" }]
keywords = ["claude-code", "session-manager", "tui", "remote-control", "urwid"]
dependencies = ["urwid>=2.0.0"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: User Interfaces",
]

[project.urls]
Homepage = "https://github.com/dzshzx/cc-session-control"
Repository = "https://github.com/dzshzx/cc-session-control"
Issues = "https://github.com/dzshzx/cc-session-control/issues"

[project.scripts]
csctl = "cc_session_control.cli:main"

[project.optional-dependencies]
dev = [
    "coverage>=7.6",
    "mypy>=1.15",
    "pytest>=7.0",
    "pytest-cov>=6.0",
    "pyyaml>=6.0",
    "ruff>=0.12",
]

[tool.setuptools.dynamic]
version = { attr = "cc_session_control.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE"]
# Ruff's formatter deliberately leaves some long strings and comments intact,
# so format output, rather than E501, is the single line-wrapping authority.
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
check_untyped_defs = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["urwid"]
# Keep the third-party widget boundary dynamic while checking every
# cc_session_control module and every project-owned type contract.
ignore_missing_imports = true
follow_imports = "skip"

[tool.coverage.run]
branch = true
relative_files = true
source = ["cc_session_control"]

[tool.coverage.report]
show_missing = true
